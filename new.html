<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Symphony | Premium Music Player</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="glass-container">
        <div class="sidebar">
            <h3>Your Library</h3>
            <ul id="playlist"></ul>
        </div>

        <div class="main-player" id="player-zone">
            <div class="song-info">
                <div class="album-art" id="art">
                    <i class="fas fa-music"></i>
                </div>
                <h2 id="title">Select a Song</h2>
                <p id="artist">Artist</p>
            </div>

            <div class="progress-container">
                <span id="current-time">0:00</span>
                <input type="range" id="progress-bar" min="0" max="100" value="0">
                <span id="duration">0:00</span>
            </div>

            <div class="controls">
                <button id="prev" title="Previous"><i class="fas fa-backward-step"></i></button>
                <button id="play-pause" class="play-btn" title="Play/Pause">
                    <i class="fas fa-play" id="play-icon"></i>
                </button>
                <button id="next" title="Next"><i class="fas fa-forward-step"></i></button>
            </div>

            <div class="volume-container">
                <i class="fas fa-volume-low"></i>
                <input type="range" id="volume-slider" min="0" max="1" step="0.05" value="0.7">
                <i class="fas fa-volume-high"></i>
            </div>
        </div>
    </div>

    <audio id="audio-element"></audio>

    <script src="script.js"></script>
</body>
</html>
